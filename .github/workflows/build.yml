name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Package
        run: make pkg
      - uses: actions/upload-artifact@v4
        with:
          name: XMDY-A4RJ-pkg
          path: build/XMDY-A4RJ-*.pkg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/XMDY-A4RJ-*.pkg --generate-notes
